<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje recibido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #171a24;
      --bg-deep: #10121a;
      --surface: #212536;
      --gold: #c9a227;
      --gold-bright: #e0bc44;
      --ink: #eae6da;
      --ink-dim: #969db3;
      --line: rgba(201, 162, 39, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -10%, #262c42 0%, var(--bg) 55%),
        var(--bg-deep);
      color: var(--ink);
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      justify-content: center;
      padding: 56px 20px 80px;
    }

    .page {
      width: 100%;
      max-width: 560px;
    }

    header {
      text-align: center;
      margin-bottom: 34px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0 0 6px;
    }

    .subtitulo {
      color: var(--ink-dim);
      font-size: 1.1rem;
      font-style: italic;
      margin: 0;
    }

    .tarjeta {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 32px;
    }

    .visor-etiqueta {
      font-size: 1.05rem;
      font-style: italic;
      color: var(--ink-dim);
      margin-bottom: 10px;
    }

    .visor {
      min-height: 130px;
      background: var(--bg-deep);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--gold-bright);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .visor.vacio {
      color: var(--ink-dim);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
    }

    .entrada-manual {
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    .entrada-manual label {
      display: block;
      font-size: 1rem;
      color: var(--ink-dim);
      margin-bottom: 8px;
    }

    .fila-entrada {
      display: flex;
      gap: 10px;
    }

    .fila-entrada input {
      flex: 1;
      background: var(--bg-deep);
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      padding: 10px 12px;
    }

    .fila-entrada input:focus,
    .fila-entrada button:focus-visible {
      outline: 2px solid var(--gold-bright);
      outline-offset: 2px;
    }

    .fila-entrada button {
      background: var(--gold);
      border: none;
      border-radius: 3px;
      color: var(--bg-deep);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1rem;
      padding: 0 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .fila-entrada button:hover {
      background: var(--gold-bright);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }

      .tarjeta {
        padding: 24px 20px;
      }

      .fila-entrada {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <h1>Mensaje recibido</h1>
      <p class="subtitulo">Solo lectura — esta pantalla no cifra ni descifra nada.</p>
    </header>

    <div class="tarjeta">
      <div class="visor-etiqueta">Contenido</div>
      <div class="visor vacio" id="visor">Todavía no ha llegado ningún mensaje.</div>

      <div class="entrada-manual">
        <label for="entrada">Pegar mensaje recibido</label>
        <div class="fila-entrada">
          <input type="text" id="entrada" placeholder="Pega aquí el texto…">
          <button id="mostrar">Mostrar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const visor = document.getElementById('visor');
    const entrada = document.getElementById('entrada');

    function mostrarMensaje(texto) {
      if (texto && texto.trim().length > 0) {
        visor.textContent = texto;
        visor.classList.remove('vacio');
      } else {
        visor.textContent = 'Todavía no ha llegado ningún mensaje.';
        visor.classList.add('vacio');
      }
    }

    // Si el mensaje llega por la URL (ej. pc2_mensaje.html?msg=texto), se muestra solo.
    const parametros = new URLSearchParams(window.location.search);
    const mensajeUrl = parametros.get('msg');
    if (mensajeUrl) {
      mostrarMensaje(decodeURIComponent(mensajeUrl));
      entrada.value = decodeURIComponent(mensajeUrl);
    }

    document.getElementById('mostrar').addEventListener('click', () => {
      mostrarMensaje(entrada.value);
    });

    entrada.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') mostrarMensaje(entrada.value);
    });
  </script>
</body>

</html>
