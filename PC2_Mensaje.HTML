<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje recibido</title>
</head>

<body>
  <div class="page">

    <header>
      <h1>Mensaje recibido</h1>
      <p class="subtitulo">Solo lectura — esta pantalla no cifra ni descifra nada.</p>
    </header>

    <div class="tarjeta">
      <div class="visor-etiqueta">Contenido</div>
      <div class="visor vacio" id="visor">Todavía no ha llegado ningún mensaje.</div>

      <div class="entrada-manual">
        <label for="entrada">Pegar mensaje recibido</label>
        <div class="fila-entrada">
          <input type="text" id="entrada" placeholder="Pega aquí el texto…">
          <button id="mostrar">Mostrar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const visor = document.getElementById('visor');
    const entrada = document.getElementById('entrada');

    function mostrarMensaje(texto) {
      if (texto && texto.trim().length > 0) {
        visor.textContent = texto;
        visor.classList.remove('vacio');
      } else {
        visor.textContent = 'Todavía no ha llegado ningún mensaje.';
        visor.classList.add('vacio');
      }
    }

    // Si el mensaje llega por la URL (ej. pc2_mensaje.html?msg=texto), se muestra solo.
    const parametros = new URLSearchParams(window.location.search);
    const mensajeUrl = parametros.get('msg');
    if (mensajeUrl) {
      mostrarMensaje(decodeURIComponent(mensajeUrl));
      entrada.value = decodeURIComponent(mensajeUrl);
    }

    document.getElementById('mostrar').addEventListener('click', () => {
      mostrarMensaje(entrada.value);
    });

    entrada.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') mostrarMensaje(entrada.value);
    });
  </script>
</body>

</html>
